---
- name: Prepare Rust Media Server
  hosts: media_servers
  become: true

  vars:
    release_version: "v0.1.0"
    github_repo: "JohannWolf/rust-media-server"

  tasks:

    - name: Create rust-media-server group
      ansible.builtin.group:
        name: rust-media-server
        state: present

    - name: Create rust-media-server user
      ansible.builtin.user:
        name: rust-media-server
        group: rust-media-server
        system: true
        home: /opt/rust-media-server
        shell: /usr/sbin/nologin
        create_home: false

    - name: Create application directory
      ansible.builtin.file:
        path: /opt/rust-media-server
        state: directory
        owner: rust-media-server
        group: rust-media-server
        mode: "0755"

    - name: Create configuration directory
      ansible.builtin.file:
        path: /etc/rust-media-server
        state: directory
        owner: root
        group: rust-media-server
        mode: "0750"

    - name: Deploy environment configuration
      ansible.builtin.template:
        src: templates/rust-media-server.env.j2
        dest: /etc/rust-media-server/rust-media-server.env
        owner: root
        group: rust-media-server
        mode: "0640"

    - name: Create application data directory
      ansible.builtin.file:
        path: /var/lib/rust-media-server
        state: directory
        owner: rust-media-server
        group: rust-media-server
        mode: "0750"

    - name: Download release binary
      ansible.builtin.get_url:
        url: "https://github.com/{{ github_repo }}/releases/download/{{ release_version }}/rust-media-server"
        dest: "/tmp/rust-media-server-{{ release_version }}"
        mode: "0755"
      register: downloaded_binary

    - name: Install release binary
      ansible.builtin.copy:
        src: "/tmp/rust-media-server-{{ release_version }}"
        dest: /opt/rust-media-server/rust-media-server
        remote_src: true
        owner: rust-media-server
        group: rust-media-server
        mode: "0755"
      notify: Restart Rust Media Server

    - name: Remove temporary release binary
      ansible.builtin.file:
        path: "/tmp/rust-media-server-{{ release_version }}"
        state: absent

    - name: Install FFmpeg
      ansible.builtin.apt:
        name: ffmpeg
        state: present
        update_cache: true

    - name: Deploy systemd service
      ansible.builtin.template:
        src: templates/rust-media-server.service.j2
        dest: /etc/systemd/system/rust-media-server.service
        owner: root
        group: root
        mode: "0644"
      notify: Restart Rust Media Server

    - name: Ensure Rust Media Server is running
      ansible.builtin.systemd:
        name: rust-media-server
        state: started
        enabled: true
        daemon_reload: true

    - name: Verify media server health
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/health"
        method: GET
        status_code: 200
      register: health_check
      retries: 5
      delay: 2
      until: health_check.status == 200

  handlers:
    - name: Restart Rust Media Server
      ansible.builtin.systemd:
        name: rust-media-server
        state: restarted
        enabled: true
        daemon_reload: true
