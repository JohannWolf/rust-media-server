[package]
name = "rust-media-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Runtime async
tokio = { version = "1", features = ["full"] }

# Web server and HTTP
axum = { version = "0.8", features = ["macros"] }

# Database (SQLite)
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }

#Monitor files
#notify = "6.1"

# Serializer (JSON)
# serde = { version = "1.0", features = ["derive"] }
# serde_json = "1.0"

# Logs
# tracing = "0.1"
# tracing-subscriber = "0.3"

#track
# sha2 = "0.10"
# hex = "0.4"
